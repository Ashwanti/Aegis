spring.application.name=aegis
spring.profiles.active=local
# JWT
jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.access-token-expiry-minutes=15
jwt.refresh-token-expiry-days=7
server.port=8081

# Statement uploads: a month of MT940 for a busy account runs to a few MB,
# well over Boot's 1MB default.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB